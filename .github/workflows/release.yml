name: Release

# Pending changesets on main / main-v2 open or update a "chore: release" PR. Merging it leaves no
# changesets, so the publish job runs: it stages the version on npm through trusted publishing
# (no token) and tags the release. It goes live once a maintainer approves the staged version on
# npm with 2FA. See RELEASING.md.
on:
  push:
    branches: [main, main-v2]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the changesets step, which may switch branches. A staged version isn't on npm until
      # it's approved, so its tag also counts as released (delete the tag to stage it again).
      - name: Read the version
        id: version
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] ||
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the release PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Stage on npm
    needs: version
    # Only a version that isn't on npm or staged yet
    if: needs.version.outputs.has-changesets == 'false' && needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Staged publishing needs npm 11.15.0 or later
      - name: Update npm
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm typecheck
          pnpm test

      # prepublishOnly builds. A prerelease goes out under its identifier (3.0.0-next.1 → next),
      # a stable release under publishConfig.tag, or latest. The trusted publisher may only stage:
      # the version goes live when a maintainer approves it on npm with 2FA.
      - name: Stage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-*)
              prerelease="${VERSION#*-}"
              npm stage publish --provenance --tag "${prerelease%%.*}"
              ;;
            *)
              npm stage publish --provenance
              ;;
          esac

      - name: Tag the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
